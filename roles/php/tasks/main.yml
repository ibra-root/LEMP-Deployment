---
# Install and configure PHP and extensions
- name: Install PPA prerequisites
  ansible.builtin.apt:
    name: "{{ php_prerequisites }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: php_use_ppa | default(false)

- name: Add the Ondřej Surý PHP PPA
  ansible.builtin.apt_repository:
    repo: "{{ php_ppa_repository }}"
    state: present
    update_cache: yes
  when: php_use_ppa | default(false)

- name: Install PHP-FPM and required WordPress extensions
  ansible.builtin.apt:
    name: "{{ php_packages }}"
    state: present
    update_cache: yes
  notify: restart php-fpm

- name: Ensure PHP-FPM is started and enabled
  ansible.builtin.service:
    name: "{{ php_fpm_service_name }}"
    state: started
    enabled: yes
