---
# Download, extract, and configure WordPress
- name: Ensure archive dependencies are installed
  ansible.builtin.apt:
    name:
      - tar
      - gzip
      - curl
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create the WordPress application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ wp_owner }}"
    group: "{{ wp_group }}"
    mode: '0755'

- name: Check if WordPress is already downloaded and extracted
  ansible.builtin.stat:
    path: "{{ app_dir }}/wp-login.php"
  register: wp_installed

- name: Download and extract the latest WordPress release
  ansible.builtin.unarchive:
    src: "{{ wp_download_url }}"
    dest: "{{ app_dir }}"
    remote_src: yes
    extra_opts:
      - --strip-components=1
    owner: "{{ wp_owner }}"
    group: "{{ wp_group }}"
  when: not wp_installed.stat.exists

- name: Render wp-config.php from the Jinja2 template
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ app_dir }}/wp-config.php"
    owner: "{{ wp_owner }}"
    group: "{{ wp_group }}"
    mode: '0640'
  no_log: true

- name: Ensure recursive ownership and permissions on the WordPress directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: "{{ wp_owner }}"
    group: "{{ wp_group }}"
    recurse: yes
