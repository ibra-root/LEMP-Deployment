---
# Install and configure Nginx
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Disable the default site in sites-enabled
  ansible.builtin.file:
    path: "{{ nginx_enabled_dir }}/default"
    state: absent
  notify: reload nginx

- name: Deploy the WordPress virtual host configuration
  ansible.builtin.template:
    src: wordpress.conf.j2
    dest: "{{ nginx_conf_dir }}/wordpress.conf"
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable the WordPress virtual host symlink
  ansible.builtin.file:
    src: "{{ nginx_conf_dir }}/wordpress.conf"
    dest: "{{ nginx_enabled_dir }}/wordpress.conf"
    state: link
  notify: reload nginx

- name: Ensure Nginx is started and enabled
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: yes
