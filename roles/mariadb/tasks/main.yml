---
# Install and configure MariaDB
- name: Install MariaDB and dependencies
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure MariaDB is started and enabled
  ansible.builtin.service:
    name: "{{ mariadb_service_name }}"
    state: started
    enabled: yes

- name: Remove anonymous MariaDB users
  community.mysql.mysql_user:
    name: ''
    host_all: yes
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: mariadb_remove_anonymous_users | default(true)

- name: Remove the MariaDB test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: mariadb_remove_test_database | default(true)

- name: Create the WordPress database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create the WordPress database user and grant privileges
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "{{ db_host }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
