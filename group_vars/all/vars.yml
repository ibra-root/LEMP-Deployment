---
# Public deployment configuration (no secrets).
# Sensitive values live encrypted in group_vars/all/vault.yml (local,
# gitignored, created by scripts/setup-vault.sh) and are referenced here
# with the `vault_` prefix.
#
# Single source of truth for shared deployment variables. Role defaults
# only hold role-internal values.

# Domain and web root
server_name: "_"
app_dir: /var/www/wordpress

# Nginx
nginx_port: 80

# PHP
php_version: "8.5"
php_fpm_user: www-data
php_fpm_group: www-data

# MariaDB credentials
db_name: wordpress_db
db_user: wp_user
db_password: "{{ vault_db_password }}"
db_host: localhost

# WordPress
wp_table_prefix: "wp_"

# WordPress auth keys and salts (encrypted in vault.yml)
wp_auth_key: "{{ vault_wp_auth_key }}"
wp_secure_auth_key: "{{ vault_wp_secure_auth_key }}"
wp_logged_in_key: "{{ vault_wp_logged_in_key }}"
wp_nonce_key: "{{ vault_wp_nonce_key }}"
wp_auth_salt: "{{ vault_wp_auth_salt }}"
wp_secure_auth_salt: "{{ vault_wp_secure_auth_salt }}"
wp_logged_in_salt: "{{ vault_wp_logged_in_salt }}"
wp_nonce_salt: "{{ vault_wp_nonce_salt }}"
