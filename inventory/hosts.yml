---
# No credentials here: SSH key + passwordless sudo (NOPASSWD).
# See README > "SSH Keys Authentication" to prepare the target node.
all:
  vars:
    ansible_user: <YOUR_USER>
    # Adjust if your key is not the default (~/.ssh/id_rsa, ~/.ssh/id_ed25519):
    ansible_ssh_private_key_file: ~/.ssh/<YOUR_KEY>   # e.g. id_ed25519
  hosts:
    nodo1:
      ansible_host: <YOUR_IP>
